<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laundry POS - Welcome</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" />
    <style>
      body {
        font-family: 'Roboto', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .landing-container {

        width: 100%;
      }
      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        padding: 12px 30px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="landing-container text-center">
      <h1 class="mb-4">Laundry POS</h1>
      <p class="lead mb-4">Manage your laundry business efficiently</p>
      <div class="d-grid gap-2">
        <a href="/signin" class="btn btn-primary btn-lg">Sign In</a>
        <a href="/signup" class="btn btn-outline-primary btn-lg">Sign Up</a>
      </div>
    </div>

</html>
